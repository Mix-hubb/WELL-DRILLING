# ============================================================
# GitLab CI/CD — Well-Drilling
# Build + test backend/frontend แล้ว trigger deploy ผ่าน Deploy Hooks
# (Render สำหรับ backend, Vercel สำหรับ frontend)
# ============================================================

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - backend/node_modules/
    - frontend/node_modules/

# ---------- BUILD ----------

build-backend:
  stage: build
  image: node:20
  script:
    - cd backend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - backend/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always

build-frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always

# ---------- DEPLOY (main branch only) ----------

deploy-render:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  needs:
    - build-backend

deploy-vercel:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -sS -X POST "$VERCEL_DEPLOY_HOOK_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  needs:
    - build-frontend