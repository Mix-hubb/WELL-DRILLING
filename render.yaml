services:
  - type: web
    name: well-drilling-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: https://well-drilling.vercel.app
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_LIFF_ID
        sync: false
      - key: APP_URL
        value: https://well-drilling-api.onrender.com
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health
